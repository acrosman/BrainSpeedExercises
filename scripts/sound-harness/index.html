<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>Sound Harness</title>
  <link rel="stylesheet" href="../../app/style.css">
  <link rel="stylesheet" href="harness.css">
  <script type="module" src="harness.js"></script>
</head>
<body>
  <main>
    <h1>Sound Harness</h1>
    <p>Play each sound from <code>audioService.js</code> on its own.</p>
    <fieldset class="sound-harness__settings">
      <legend>Sweep timing</legend>
      <label for="sweep-duration-ms">
        Sweep length (ms)
        <input id="sweep-duration-ms" type="number" min="1" step="1" value="600">
      </label>
      <label for="sweep-isi-ms">
        Gap between sweeps (ms)
        <input id="sweep-isi-ms" type="number" min="1" step="1" value="600">
      </label>
    </fieldset>
    <ul id="sound-list"></ul>
  </main>
</body>
</html>
