<ul>
  <li>Get <strong>3 correct in a row</strong> to move up a level.</li>
  <li>Get <strong>3 wrong in a row</strong> to drop back 2 levels.</li>
</ul>
<p>
  Higher levels show the pattern for less time and with fainter stripes. Press
  <strong>End Game</strong> whenever you want to stop and save your progress.
</p>
