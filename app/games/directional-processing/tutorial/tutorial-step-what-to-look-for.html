<p>
  Watch which way the stripes <strong>move</strong>. That direction is your answer.
</p>
<ul>
  <li>Horizontal stripes move <strong>up</strong> or <strong>down</strong>.</li>
  <li>Vertical stripes move <strong>left</strong> or <strong>right</strong>.</li>
</ul>
<p>
  Direction matters: if the stripes moved up, the answer is Up. Choosing Down is wrong.
</p>
