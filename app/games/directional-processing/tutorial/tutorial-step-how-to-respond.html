<p>
  After the pattern disappears, a plain gray square flashes briefly. Once it is gone, the direction
  buttons become active.
</p>
<ul>
  <li>Press an arrow key (<kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&larr;</kbd> <kbd>&rarr;</kbd>)
    or click a direction button.</li>
  <li>If you are wrong, the correct direction is highlighted so you can see what you missed.</li>
</ul>
