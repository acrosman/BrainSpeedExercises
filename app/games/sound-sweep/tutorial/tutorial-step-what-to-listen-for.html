<p>
  Listen to which way each sweep <strong>moves</strong> in pitch.
</p>
<ul>
  <li><strong>Up</strong> rises from a low pitch to a high one, like a "weep".</li>
  <li><strong>Down</strong> falls from a high pitch to a low one, like a "woop".</li>
</ul>
<p>
  Order matters: if the first sweep went up and the second went down, the answer is
  <strong>Up-Down</strong>. Choosing Down-Up is wrong.
</p>
