name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      # Forge publishes to the release named v<package.json version>, not to the pushed tag.
      # A tag pushed without bumping the version would upload to the previous release.
      - name: Check tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Install rpm tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One universal build runs natively on both Apple Silicon and Intel Macs.
        run: npm run publish -- ${{ matrix.os == 'macos-latest' && '--arch=universal' || '' }}
